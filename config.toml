# Halftone configuration.
#
# A preset is applied field by field over the built-in defaults, so you only
# need to specify what differs. Run `halftone preset list` to see everything
# that ships with the application.

default_preset = "classic"

# Heavier ink with more contrast.
[presets.bold]
style = "dots"
cell_size = 8.0
angle = 45.0
contrast = 1.25

# Blue line work, useful for technical illustrations.
[presets.blueprint]
style = "lines"
cell_size = 5.0
angle = 0.0
foreground = "#1b4f9c"

# Four-color dots using classic screen angles.
[presets.duotone]
style = "dots"
cell_size = 5.0
color_mode = "cmyk"

# Large, sparse dots for posters.
[presets.sparse]
style = "dots"
cell_size = 14.0
angle = 20.0
max_dot_scale = 1.1
