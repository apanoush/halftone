[workspace]
resolver = "3"
members = [
    "crates/halftone-core",
    "crates/halftone-cli",
    "crates/halftone-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors= ["aa-p"]

[workspace.dependencies]
halftone-core = { path = "crates/halftone-core" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
glam = "0.34.1"
iced = "0.14.0"
image = "0.25.10"
rayon = "1.12.0"
rfd = "0.17.2"
resvg = "0.48.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tobj = "4.0.5"
toml = "1.1.8"

[profile.release]
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
